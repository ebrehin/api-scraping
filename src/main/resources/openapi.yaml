openapi: 3.0.3
info:
  title: API de Scraping de Films
  description: |
    API REST permettant de scraper un film via OMDb, persister les entites,
    et retourner un FilmDTO.
  version: 1.0.0
  contact:
    name: Support API
    email: support@example.com

servers:
  - url: http://localhost:8085
    description: Serveur de developpement local

tags:
  - name: scraping
    description: Operations liees au scraping de films

paths:
  /api/scrap/film:
    get:
      tags:
        - scraping
      summary: Scrape un film par titre
      description: Retourne le film trouve et persiste en base si necessaire
      operationId: scrapeFilm
      parameters:
        - name: query
          in: query
          description: Titre du film a rechercher
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Film recupere avec succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmDto'
        '404':
          description: Film non trouve
        '500':
          description: Erreur serveur interne

components:
  schemas:
    FilmDto:
      type: object
      description: Representation d'un film
      properties:
        title:
          type: string
          description: Titre du film
          example: Inception
        publicationYear:
          type: integer
          format: int32
          description: Annee de publication
          example: 2010
        artists:
          type: array
          description: Liste des artistes (acteurs)
          items:
            $ref: '#/components/schemas/ArtistDto'
        poster:
          $ref: '#/components/schemas/PosterDto'
      required:
        - title
        - publicationYear
        - artists
        - poster

    ArtistDto:
      type: object
      description: Artiste associe au film
      properties:
        firstName:
          type: string
          description: Prenom
          example: Leonardo
        lastName:
          type: string
          description: Nom
          example: DiCaprio
      required:
        - firstName

    PosterDto:
      type: object
      description: Affiche associee au film
      properties:
        title:
          type: string
          description: Titre associe a l'affiche
          example: Inception poster
        imageUrl:
          type: string
          description: URL de l'image
          example: https://example.com/poster.jpg
      required:
        - title
        - imageUrl
